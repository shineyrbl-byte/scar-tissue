modules:
  jira:issuePanel:
    - key: scar-tissue-panel
      resource: panel
      resolver:
        function: panel-resolver
      render: native
      title: Scar Tissue
      icon: resource:static-assets;icon.svg

  function:
    - key: panel-resolver
      handler: resolvers/index.handler

resources:
  - key: panel
    path: src/frontend/index.jsx
  - key: static-assets
    path: static

app:
  runtime:
    name: nodejs22.x
  # Replaced by `forge register` with your own app id.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:confluence-content.all
    - search:confluence
